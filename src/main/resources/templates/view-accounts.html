<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Account Details</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #e8f0fe, #f4f9ff);
    min-height: 100vh;
    padding: 30px 20px;
  }

  h2 {
    text-align: center;
    color: #1a237e;
    font-size: 26px;
    margin-bottom: 24px;
    letter-spacing: 1px;
  }

  .table-wrapper {
    overflow-x: auto;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    max-width: 1400px;
    margin: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    font-size: 14px;
  }

  thead tr {
    background: linear-gradient(90deg, #1565c0, #1e88e5);
    color: white;
  }

  th {
    padding: 14px 12px;
    text-align: center;
    font-weight: 600;
    letter-spacing: 0.5px;
    white-space: nowrap;
  }

  td {
    padding: 12px 10px;
    text-align: center;
    border-bottom: 1px solid #e3eaf5;
    color: #333;
    white-space: nowrap;
  }

  tr:nth-child(even) td { background: #f0f4ff; }
  tr:hover td { background: #dce8ff; transition: background 0.2s; }

  .btn {
    display: inline-block;
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
    transition: all 0.2s;
  }

  .btn-delete { background:#ffebee; color:#c62828; border:1px solid #ef9a9a; }
  .btn-delete:hover { background:#c62828; color:white; }

  .btn-edit { background:#e8f5e9; color:#2e7d32; border:1px solid #a5d6a7; }
  .btn-edit:hover { background:#2e7d32; color:white; }
</style>
</head>
<body>

<h2>🏦 Account Details</h2>

<div class="table-wrapper">
  <table>
    <thead>
      <tr>
        <th>Delete</th>
        <th>Edit</th>
        <th>Account No</th>
        <th>Type</th>
        <th>First Name</th>
        <th>Middle Name</th>
        <th>Last Name</th>
        <th>DOB</th>
        <th>Gender</th>
        <th>PAN</th>
        <th>Current Address</th>
        <th>Permanent Address</th>
        <th>Mobile</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="acc : ${accounts}">
        <td>
          <a th:href="@{/dashboard/delete/{id}(id=${acc.accountNumber})}"
             class="btn btn-delete"
             onclick="return confirm('Are you sure you want to delete?')">
            Delete
          </a>
        </td>
        <td>
          <a th:href="@{/dashboard/edit/{id}(id=${acc.accountNumber})}"
             class="btn btn-edit">
            Edit
          </a>
        </td>
        <td th:text="${acc.accountNumber}"></td>
        <td th:text="${acc.accountType}"></td>
        <td th:text="${acc.firstName}"></td>
        <td th:text="${acc.middleName}"></td>
        <td th:text="${acc.lastName}"></td>
        <td th:text="${acc.dob}"></td>
        <td th:text="${acc.gender}"></td>
        <td th:text="${acc.panNumber}"></td>
        <td th:text="${acc.currentAddress}"></td>
        <td th:text="${acc.permanentAddress}"></td>
        <td th:text="${acc.mobile}"></td>
      </tr>
    </tbody>
  </table>
</div>

</body>
</html>
